<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Login & Register</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login_form.css">
</head>
<body>

<div class="container">

    <div class="logo">
        <h1>Nabil Catering</h1>
        <p>Login atau Register untuk melanjutkan</p>
    </div>

    <div class="tabs">
        <button class="active" onclick="showForm('login', this)">Login</button>
        <button onclick="showForm('register', this)">Register</button>
    </div>

    <div id="login" class="form active">
        <div class="input-group">
            <label>Username</label>
            <input type="text" placeholder="Masukkan username">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Masukkan password">
        </div>

        <button class="btn">Masuk</button>

        <div class="footer">
            Belum punya akun? <a href="#" onclick="showForm('register', document.querySelectorAll('.tabs button')[1]); return false;">Klik Register</a>
        </div>
    </div>

    <div id="register" class="form">
        <div class="input-group">
            <label>Nama Lengkap</label>
            <input type="text" placeholder="Masukkan nama lengkap">
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" placeholder="Masukkan email">
        </div>

        <div class="input-group">
            <label>Username</label>
            <input type="text" placeholder="Buat username">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Buat password">
        </div>

        <button class="btn">Daftar Sekarang</button>

        <div class="footer">
            Sudah punya akun? <a href="#" onclick="showForm('login', document.querySelectorAll('.tabs button')[0]); return false;">Klik Login</a>
        </div>
    </div>

</div>

<script>
function showForm(id, btn){
    document.querySelectorAll('.form').forEach(el=>el.classList.remove('active'));
    document.querySelectorAll('.tabs button').forEach(el=>el.classList.remove('active'));

    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
}
</script>

</body>
</html>
