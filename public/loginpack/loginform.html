<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Login & Register</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login_form.css">
<style>
    /* Style untuk pesan notifikasi/alert */
    .alert {
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 15px;
        font-size: 14px;
        display: none;
        text-align: center;
    }
    .alert-danger { background-color: #f8d7da; color: #721c24; }
    .alert-success { background-color: #d4edda; color: #155724; }
</style>
</head>
<body>

<div class="container">
    <div class="home-navigation">
        <a href="../index.html" class="btn-home">🏠Home</a>
    </div>

    <div class="logo">
        <h1>Nabil Catering</h1>
        <p>Login atau Register untuk melanjutkan</p>
    </div>

    <div class="tabs">
        <button class="active" onclick="showForm('login', this)">Login</button>
        <button onclick="showForm('register', this)">Register</button>
    </div>

    <div id="alertMessage" class="alert"></div>

    <form id="login" class="form active" onsubmit="handleLogin(event)">
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="loginUsername" placeholder="Masukkan username" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Masukkan password" required>
        </div>

        <button type="submit" class="btn">Masuk</button>

        <div class="footer">
            Belum punya akun? <a href="#" onclick="showForm('register', document.querySelectorAll('.tabs button')[1]); return false;">Klik Register</a>
        </div>
    </form>

    <form id="register" class="form" onsubmit="handleRegister(event)">
        <div class="input-group">
            <label>Nama Lengkap</label>
            <input type="text" placeholder="Masukkan nama lengkap" required>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" placeholder="Masukkan email" required>
        </div>

        <div class="input-group">
            <label>Username</label>
            <input type="text" placeholder="Buat username" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Buat password" required>
        </div>

        <button type="submit" class="btn">Daftar Sekarang</button>

        <div class="footer">
            Sudah punya akun? <a href="#" onclick="showForm('login', document.querySelectorAll('.tabs button')[0]); return false;">Klik Login</a>
        </div>
    </form>

</div>

<script>
// Fungsi Tab Switcher bawaan kamu
function showForm(id, btn){
    document.querySelectorAll('.form').forEach(el=>el.classList.remove('active'));
    document.querySelectorAll('.tabs button').forEach(el=>el.classList.remove('active'));

    document.getElementById(id).classList.add('active');
    btn.classList.add('active');

    // Sembunyikan alert setiap kali pindah tab
    document.getElementById('alertMessage').style.display = 'none';
}

// Fungsi pembantu untuk memunculkan pesan (hilang otomatis dalam 3 detik)
function showAlert(message, type) {
    const alertBox = document.getElementById('alertMessage');
    alertBox.textContent = message;
    alertBox.className = `alert alert-${type}`;
    alertBox.style.display = 'block';

    setTimeout(() => {
        alertBox.style.display = 'none';
    }, 3000);
}

// LOGIKA PROSES LOGIN
function handleLogin(event) {
    event.preventDefault(); // Mencegah halaman reload otomatis

    const usernameInput = document.getElementById('loginUsername').value.trim();
    const passwordInput = document.getElementById('loginPassword').value;

    // Kredensial khusus Admin (Bisa kamu ganti sesuai keinginan)
    const adminUsername = "admin"; 
    const adminPassword = "admin123";

    if (usernameInput === adminUsername && passwordInput === adminPassword) {
        showAlert("Login Admin Sukses!", "success");
        
        // Simpan status session admin
        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('role', 'admin');

        // Pindah ke admin.html yang berada di LUAR folder loginpack (mundur 1 folder dengan ../)
        setTimeout(() => {
            window.location.href = '../admin.html';
        }, 1000);

    } else {
        // Logika untuk User Biasa jika username/password bukan admin
        // Di sini langsung disimulasikan berhasil login ke index.html utama
        showAlert("Login Berhasil! Selamat datang.", "success");
        
        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('role', 'user');

        setTimeout(() => {
            // Jika index.html juga di luar folder, gunakan '../index.html'
            window.location.href = '../index.html'; 
        }, 1500);
    }
}

// LOGIKA PROSES REGISTER (Hanya untuk User Biasa)
function handleRegister(event) {
    event.preventDefault();
    
    showAlert("Registrasi Berhasil! Silakan login.", "success");
    document.getElementById('register').reset();

    // Otomatis pindah ke tab login setelah 2 detik
    setTimeout(() => {
        showForm('login', document.querySelectorAll('.tabs button')[0]);
    }, 2000);
}
</script>

</body>
</html>
